<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Users</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<!-- NAVBAR -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">👑 Manage Users</h2>
        <a href="/admin/user/create" class="btn btn-primary">➕ Add New User</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">Users List</h5>
        </div>

        <div class="table-responsive">
            <table class="table table-hover table-striped align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nume</th>
                    <th>Username</th>
                    <th>Rol</th>
                    <th>Acțiuni</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="u : ${users}">
                    <td th:text="${u.id}"></td>
                    <td th:text="${u.nume}"></td>
                    <td th:text="${u.utilizator}"></td>
                    <td>
                        <span class="badge bg-primary" th:text="${u.rol}"></span>
                    </td>
                    <td>
                        <a th:href="@{/admin/user/edit/{id}(id=${u.id})}" class="btn btn-warning btn-sm me-2">✏ Edit</a>

                        <a th:href="@{/admin/user/delete/{id}(id=${u.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Sigur vrei să ștergi acest utilizator?');">
                            🗑 Delete
                        </a>
                    </td>
                </tr>
                </tbody>

            </table>
        </div>
    </div>

</div>

</body>
</html>
