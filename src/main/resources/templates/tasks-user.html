<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Task Manager - Task List</title>

    <!-- Bootstrap CDN -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

</head>
<body class="bg-light">

<div class="container mt-4">

    <!-- Mesaj de bun venit -->
    <h2 class="mb-3">Bine ai venit, <span th:text="${username}">user</span>!</h2>

    <!-- Formular de filtrare -->
    <div class="card mb-4">
        <div class="card-header bg-primary text-white">Filtrează task-uri</div>
        <div class="card-body">

            <form method="get" action="/tasks">

                <div class="row">
                    <!-- STATUS -->
                    <div class="col-md-4">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select">
                            <option value="">Toate</option>
                            <option value="TODO">TODO</option>
                            <option value="IN_PROGRESS">IN_PROGRESS</option>
                            <option value="DONE">DONE</option>
                        </select>
                    </div>

                    <!-- PRIORITATE -->
                    <div class="col-md-4">
                        <label class="form-label">Prioritate</label>
                        <select name="prioritate" class="form-select">
                            <option value="">Toate</option>
                            <option value="LOW">LOW</option>
                            <option value="MEDIUM">MEDIUM</option>
                            <option value="HIGH">HIGH</option>
                        </select>
                    </div>

                    <!-- CATEGORIE -->
                    <div class="col-md-4">
                        <label class="form-label">Categorie</label>
                        <input type="text" name="categorie" class="form-control"
                               placeholder="Ex: Backend">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary mt-3 w-100">Filtrează</button>

            </form>

        </div>
    </div>

    <!-- Mesaj despre filtrare -->
    <h5 class="mb-3" th:text="${filterMessage}">Toate task-urile</h5>

    <!-- Tabel task-uri -->
    <div class="card">
        <div class="card-header bg-dark text-white">Lista task-uri</div>

        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Titlu</th>
                    <th>Descriere</th>
                    <th>Status</th>
                    <th>Prioritate</th>
                    <th>Categorie</th>
                    <th>Data creare</th>
                    <th>Data limită</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="task : ${tasks}">
                    <td th:text="${task.id}"></td>
                    <td th:text="${task.titlu}"></td>
                    <td th:text="${task.descriere}"></td>
                    <td th:text="${task.status}"></td>
                    <td th:text="${task.prioritate}"></td>
                    <td th:text="${task.categorie}"></td>
                    <td th:text="${task.dataCreare}"></td>
                    <td th:text="${task.dataLimita}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
