<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Task Manager - Task List</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-3">
    <h2 class="fw-bold text-dark">
        👋 Bine ai venit,
        <span class="text-primary" th:text="${username}"></span>!
    </h2>
    <hr>
</div>





<div class="container mt-4">

    <!-- Mesaj filtrare -->
    <h4 class="mb-4" th:text="${filterMessage}">Toate task-urile</h4>

    <!-- Card Filtrare -->
    <div class="card mb-4">
        <div class="card-header bg-primary text-white">🔎 Filtrează task-urile</div>

        <div class="card-body">
            <form method="get" action="/tasks">

                <div class="row">

                    <!-- STATUS -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select">
                            <option value="">Toate</option>
                            <option value="TODO">TODO</option>
                            <option value="IN_PROGRESS">IN_PROGRESS</option>
                            <option value="DONE">DONE</option>
                        </select>
                    </div>

                    <!-- PRIORITATE -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Prioritate</label>
                        <select name="prioritate" class="form-select">
                            <option value="">Toate</option>
                            <option value="LOW">LOW</option>
                            <option value="MEDIUM">MEDIUM</option>
                            <option value="HIGH">HIGH</option>
                        </select>
                    </div>

                    <!-- CATEGORIE -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Categorie</label>
                        <input type="text" name="categorie" class="form-control"
                               placeholder="Ex: Backend">
                    </div>

                </div>

                <button type="submit" class="btn btn-primary w-100">Filtrează</button>

            </form>
        </div>
    </div>

    <!-- Lista task-uri -->
    <div class="card">
        <div class="card-header bg-dark text-white">📋 Lista Task-uri</div>

        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-dark text-center">
                <tr>
                    <th>ID</th>
                    <th>Titlu</th>
                    <th>Descriere</th>
                    <th>Status</th>
                    <th>Prioritate</th>
                    <th>Categorie</th>
                    <th>Creat</th>
                    <th>Deadline</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="task : ${tasks}" class="text-center">
                    <td th:text="${task.id}"></td>
                    <td th:text="${task.titlu}"></td>
                    <td th:text="${task.descriere}"></td>
                    <td th:text="${task.status}"></td>
                    <td th:text="${task.prioritate}"></td>
                    <td th:text="${task.categorie}"></td>
                    <td th:text="${task.dataCreare}"></td>
                    <td th:text="${task.dataLimita}"></td>
                </tr>
                </tbody>

            </table>
        </div>
    </div>

</div>

</body>
</html>
