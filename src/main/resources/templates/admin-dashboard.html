<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body class="bg-light">

<!-- NAVBAR -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-3">
    <h2 class="fw-bold text-dark">
        👋 Bine ai venit,
        <span class="text-primary" th:text="${username}"></span>!
    </h2>
    <hr>
</div>


<div class="container mt-4">

    <h2 class="fw-bold mb-4">📊 Admin Dashboard</h2>

    <!-- STAT CARDS -->
    <div class="row g-4">

        <!-- TOTAL USERS -->
        <div class="col-md-3">
            <div class="card shadow-sm border-0 bg-primary text-white">
                <div class="card-body">
                    <h5 class="card-title">Total Users</h5>
                    <h2 th:text="${totalUsers}">0</h2>
                </div>
            </div>
        </div>

        <!-- TOTAL TASKS -->
        <div class="col-md-3">
            <div class="card shadow-sm border-0 bg-dark text-white">
                <div class="card-body">
                    <h5 class="card-title">Total Tasks</h5>
                    <h2 th:text="${totalTasks}">0</h2>
                </div>
            </div>
        </div>

        <!-- TODO -->
        <div class="col-md-2">
            <div class="card shadow-sm border-0 bg-warning">
                <div class="card-body">
                    <h6>TODO</h6>
                    <h3 th:text="${tasksTodo}">0</h3>
                </div>
            </div>
        </div>

        <!-- IN PROGRESS -->
        <div class="col-md-2">
            <div class="card shadow-sm border-0 bg-info text-white">
                <div class="card-body">
                    <h6>In Progress</h6>
                    <h3 th:text="${tasksInProgress}">0</h3>
                </div>
            </div>
        </div>

        <!-- DONE -->
        <div class="col-md-2">
            <div class="card shadow-sm border-0 bg-success text-white">
                <div class="card-body">
                    <h6>Done</h6>
                    <h3 th:text="${tasksDone}">0</h3>
                </div>
            </div>
        </div>

    </div>

    <!-- CHARTS -->
    <div class="row mt-5">

        <!-- PIE CHART -->
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-secondary text-white">Task Status Chart</div>
                <div class="card-body">
                    <canvas id="tasksChart"></canvas>
                </div>
            </div>
        </div>

        <!-- BAR CHART -->
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-secondary text-white">Users vs Tasks</div>
                <div class="card-body">
                    <canvas id="usersTasksChart"></canvas>
                </div>
            </div>
        </div>

    </div>

</div>

<!-- CHART.JS SCRIPT -->
<script th:inline="javascript">

    const tasksTodo = /*[[${tasksTodo}]]*/ 0;
    const tasksInProgress = /*[[${tasksInProgress}]]*/ 0;
    const tasksDone = /*[[${tasksDone}]]*/ 0;
    const totalUsers = /*[[${totalUsers}]]*/ 0;
    const totalTasks = /*[[${totalTasks}]]*/ 0;

    const tasksChart = new Chart(document.getElementById('tasksChart'), {
        type: 'pie',
        data: {
            labels: ['TODO', 'In Progress', 'Done'],
            datasets: [{
                data: [tasksTodo, tasksInProgress, tasksDone]
            }]
        }
    });

    const usersTasksChart = new Chart(document.getElementById('usersTasksChart'), {
        type: 'bar',
        data: {
            labels: ['Users', 'Tasks'],
            datasets: [{
                data: [totalUsers, totalTasks]
            }]
        }
    });

</script>


</body>
</html>
