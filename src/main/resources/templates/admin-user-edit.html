<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">

    <div class="card shadow-sm">
        <div class="card-header bg-warning">
            <h4 class="mb-0">✏ Edit User</h4>
        </div>

        <div class="card-body">

            <form action="/admin/user/update" method="post">

                <input type="hidden" name="id" th:value="${user.id}">

                <div class="mb-3">
                    <label class="form-label">Nume</label>
                    <input type="text" name="nume" class="form-control" th:value="${user.nume}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="utilizator" class="form-control" th:value="${user.utilizator}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Rol</label>
                    <select name="rol" class="form-select" th:value="${user.rol}">
                        <option value="ROLE_USER">User</option>
                        <option value="ROLE_EDITOR">Editor</option>
                        <option value="ROLE_ADMIN">Admin</option>
                    </select>
                </div>

                <button class="btn btn-primary w-100">💾 Save Changes</button>

            </form>

            <hr>

            <!-- Reset password section -->
            <h5 class="mt-3">🔐 Reset Password</h5>

            <form action="/admin/user/reset-password" method="post">
                <input type="hidden" name="id" th:value="${user.id}">

                <div class="input-group">
                    <input type="password" name="newPassword" class="form-control" placeholder="New Password" required>
                    <button class="btn btn-danger">Reset</button>
                </div>

            </form>
        </div>
    </div>

</div>

</body>
</html>
