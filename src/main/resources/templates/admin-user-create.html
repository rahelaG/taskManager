<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">➕ Create New User</h4>
        </div>

        <div class="card-body">

            <form action="/admin/user/save" method="post">

                <div class="mb-3">
                    <label class="form-label">Nume</label>
                    <input type="text" name="nume" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="utilizator" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Parolă</label>
                    <input type="password" name="parola" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Rol</label>
                    <select name="rol" class="form-select" required>
                        <option value="ROLE_USER">User</option>
                        <option value="ROLE_EDITOR">Editor</option>
                        <option value="ROLE_ADMIN">Admin</option>
                    </select>
                </div>

                <button class="btn btn-success w-100">✔ Save User</button>

            </form>

        </div>
    </div>

</div>

</body>
</html>
